spring.application.name=lab

# =====================================
# CHAT MODEL
# =====================================

spring.ai.model.chat=ollama


# =====================================
# OLLAMA CONNECTION
# =====================================

spring.ai.ollama.base-url=http://localhost:11434


# =====================================
# MODEL
# =====================================

spring.ai.ollama.chat.model=qwen2.5:3b-instruct

spring.ai.ollama.chat.keep-alive=5m

spring.ai.ollama.chat.think=false


# =====================================
# GENERATION PARAMETERS
# =====================================

spring.ai.ollama.chat.temperature=0.3

spring.ai.ollama.chat.top-k=40

spring.ai.ollama.chat.top-p=0.9

spring.ai.ollama.chat.min-p=0.0

spring.ai.ollama.chat.num-predict=1024

spring.ai.ollama.chat.num-ctx=4096

spring.ai.ollama.chat.num-batch=512

spring.ai.ollama.chat.repeat-penalty=1.1

spring.ai.ollama.chat.frequency-penalty=0.0

spring.ai.ollama.chat.presence-penalty=0.0

spring.ai.ollama.chat.seed=-1


# =====================================
# PERFORMANCE
# =====================================

spring.ai.ollama.chat.num-thread=0

spring.ai.ollama.chat.num-gpu=-1

spring.ai.ollama.chat.use-mlock=false


# =====================================
# MODEL INITIALIZATION
# =====================================

spring.ai.ollama.init.pull-model-strategy=never

spring.ai.ollama.init.timeout=5m

spring.ai.ollama.init.max-retries=1

